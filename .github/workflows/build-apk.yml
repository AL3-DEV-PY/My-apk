name: Build LinguaX APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Create Supabase configuration
        run: |
          mkdir -p app/src/main/java/com/example/data/supabase

          cat > app/src/main/java/com/example/data/supabase/SupabaseConfig.kt <<'EOF'
          package com.example.data.supabase

          object SupabaseConfig {
              const val SUPABASE_URL = "${{ secrets.SUPABASE_URL }}"
              const val SUPABASE_ANON_KEY = "${{ secrets.SUPABASE_ANON_KEY }}"
          }
          EOF

      - name: Verify Gradle
        run: ./gradlew --version

      - name: Clean project
        run: ./gradlew clean --no-daemon

      - name: Build APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK exists
        run: |
          echo "Generated APK files:"
          find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload LinguaX APK
        uses: actions/upload-artifact@v4
        with:
          name: LinguaX-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
