```yaml
name: Build LinguaX APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Java 17
      # --------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # --------------------------------------------------
      # 3. Android SDK
      # --------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3


      # --------------------------------------------------
      # 4. Install Gradle 9.3.1
      #
      # IMPORTANT:
      # We DO NOT use ./gradlew because the project's
      # gradle-wrapper.jar is corrupted.
      # --------------------------------------------------
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'


      # --------------------------------------------------
      # 5. Verify Gradle
      # --------------------------------------------------
      - name: Verify Gradle
        run: |
          gradle --version


      # --------------------------------------------------
      # 6. Create local.properties
      #
      # The Secrets Gradle Plugin in this project is
      # configured to read local.properties.
      # --------------------------------------------------
      - name: Create local.properties
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cat > local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          VITE_SUPABASE_URL=$SUPABASE_URL
          VITE_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          EOF

          echo "local.properties created."


      # --------------------------------------------------
      # 7. Create .env
      #
      # The project also reads .env for its configuration.
      # --------------------------------------------------
      - name: Create .env
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cat > .env <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          VITE_SUPABASE_URL=$SUPABASE_URL
          VITE_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          EOF

          echo ".env created."


      # --------------------------------------------------
      # 8. Create debug keystore
      #
      # app/build.gradle.kts expects:
      # ${rootDir}/debug.keystore
      # --------------------------------------------------
      - name: Create debug keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "Debug keystore created."


      # --------------------------------------------------
      # 9. Clean
      # --------------------------------------------------
      - name: Clean project
        run: |
          gradle clean \
            --no-daemon \
            --stacktrace


      # --------------------------------------------------
      # 10. Build APK
      #
      # IMPORTANT:
      # Use installed Gradle, NOT ./gradlew.
      # --------------------------------------------------
      - name: Build APK
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace


      # --------------------------------------------------
      # 11. Verify APK
      # --------------------------------------------------
      - name: Verify APK exists
        run: |
          echo "Generated APK files:"

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo "APK generated successfully."


      # --------------------------------------------------
      # 12. Upload APK
      # --------------------------------------------------
      - name: Upload LinguaX APK
        uses: actions/upload-artifact@v4
        with:
          name: LinguaX-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
```
